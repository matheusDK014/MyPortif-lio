<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"crossorigin="anonymous"/>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="./src/css/global-style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="./src/css/header/header.css" />
    <link rel="stylesheet" href="./src/css/main/main.css" />
    <link rel="stylesheet" href="./src/css/footer/footer.css" />
    <link rel="icon" href="assets/icon.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Arya:wght@400;700&display=swap" rel="stylesheet"/>
    <title>MounK 2.0</title>
  </head>

  <body>
    <header class="header-navbar">
      <div class="wrapper">
        <img class="header-lg-mk-container" src="assets/Moun K Logo.svg" alt="Logo MounK"/>
      </div>
      <nav class="header-tp-buttons-navbar">
        <a href="#about-me" class="header-custom-button-navbar" data-translate="navbar.about">
          About Me
        </a>
        <a href="#projects" class="header-custom-button-navbar" data-translate="navbar.projects">
          Projects
        </a>
        <a class="header-custom-button-navbar" data-translate="navbar.languages">
          My Dev Language
        </a>
        <a class="header-custom-button-navbar" data-translate="navbar.blog">
          Blog
        </a>
        <a href="#contact-us" class="header-custom-button-navbar" data-translate="navbar.contact">
          Contact Us
        </a>
      </nav>
      <div class="tools-buttons-navbar">
        <a href="https://wa.me/qr/QFSHJVJIIX3OF1" target="_blank" class="header-hire-me-button-navbar" data-translate="navbar.hire">
          Hire Me!
        </a>
        <button class="header-lang-button-navbar" id="language-toggle">
          <img class="header-lang-img-hover-navbar" src="assets/language.svg" alt="Ícone de idioma"/>
        </button>
      </div>
    </header>

    <main>
      <section id="about-me" class="main-myport-container">
        <div class="main-about-me-container">
          <div class="main-helloword">
            <img src="assets/helloword.svg" alt="Hello World" class="helloword"/>
          </div>
          <h1 class="main-title" data-translate="cover.title">
            Matheus Rodrigues
          </h1>
          <p class="main-subtitle" data-translate="cover.subtitle">
            A Professional Web Developer
          </p>
          <div class="main-button-group">
            <a href="assets/curriculo.pdf" target="_blank" class="main-download-cv-button" data-translate="cover.download">
              Download CV
            </a>
            <button class="main-my-work-button" data-translate="cover.myWork">
              My Work
            </button>
          </div>
        </div>
      </section>
      <section class="main-my-projects">
        <div class="main-my-projects-container">
          <img class="main-lines" src="assets/Lines.svg" alt="Linhas decorativas"/>
        </div>
        <div class="main-line-text-container">
          <h2 class="main-line-text" data-translate="navbar.projects">Projects</h2>
        </div>
      </section>

      <section id="projects" class="main-project-cards-container">
        <!--updateProjectsLanguage -->
      </section>

    </main>

    <footer id="contact-us" class="container-footer">
      <div>
        <img class="footer-logo" src="assets/Moun K Logo.svg" alt="Logo MounK"/>
        <a class="footer-text-empresa" href="">© 2025 Empresa, Inc.</a>
      </div>
      <div class="footer-icons-rs">
        <a href="https://www.instagram.com/mdk_wyl?igsh=MmVkcm4xbTNsMm40" target="_blank">
          <i class="bi bi-instagram"></i>
        </a>
        <a href="https://github.com/matheusDK014/MyPortif-lio.git" target="_blank">
          <i class="bi bi-github"></i>
        </a>
        <a href="https://www.linkedin.com/in/matheus-da-costa-da-silva-6396561a9?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" target="_blank">
          <i class="bi bi-linkedin"></i>
        </a>
        <a href="https://wa.me/qr/QFSHJVJIIX3OF1" target="_blank">
          <i class="bi bi-whatsapp"></i>
        </a>
      </div>
      <div>
        <form action="">
          <p class="footer-title-2">DEIXE SEU COMENTÁRIO</p>
          <input class="footer-input" placeholder="Email Address" type="email"/>
          <input class="footer-input" placeholder="Leave a comment here" type="text"/>
          <button class="footer-button btn btn-primary">enviar</button>
        </form>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"></script>
    <script src="./src/js/content.js"></script>
    <script src="./src/js/language-toggle.js"></script>
  </body>
</html>
